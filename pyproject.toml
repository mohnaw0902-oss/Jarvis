[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Secure, extensible desktop AI assistant backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0", "aiosqlite>=0.20", "httpx>=0.27", "python-dotenv>=1.0",
  "loguru>=0.7", "rich>=13.7", "typer>=0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jarvis = "jarvis.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
